<section class="mt-4 flex-col gap-4">
    <h2 class="h2 mb-2">IconButton</h2>

    <div class="flex-col gap-2">
        <h3 class="h3">Basic Usage</h3>
        <div class="bg-white border rounded p-4 shadow">
            <ui-icon-button ariaLabel="Search">
                <span icon>🔍</span>
            </ui-icon-button>
        </div>

    </div>

    <div class="flex-col gap-2">
        <h3 class="h3">Advanced Usage</h3>
        <div class="bg-white border rounded p-4 shadow">
            <ui-icon-button [ariaLabel]="'Save'" [variant]="'ghost'" [disabled]="false">
                <span icon>💾</span>
            </ui-icon-button>
        </div>

    </div>

</section>
